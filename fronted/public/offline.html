<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - 摄影分享平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0F1C2D 0%, #1E2532 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F5F7FA;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #4A5F8B, #6B7C93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 16px;
            color: #B8C6D8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #4A5F8B, #3A4B6F);
            color: #F5F7FA;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn:hover {
            background: linear-gradient(135deg, #6B7C93, #4A5F8B);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 95, 139, 0.3);
        }
        .tips {
            margin-top: 40px;
            padding: 20px;
            background: rgba(74, 95, 139, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(74, 95, 139, 0.2);
            text-align: left;
        }
        .tips h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4A5F8B;
        }
        .tips ul {
            list-style: none;
            font-size: 13px;
            color: #B8C6D8;
        }
        .tips li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }
        .tips li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4A5F8B;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📷</div>
        <h1>网络连接已断开</h1>
        <p>看起来网络不太稳定。请检查您的网络设置，或稍后重试。</p>
        <button class="btn" onclick="location.reload()">
            <span>🔄</span>
            重新加载
        </button>
        <div class="tips">
            <h3>💡 离线提示</h3>
            <ul>
                <li>已缓存的页面仍可查看</li>
                <li>尝试切换到更稳定的网络</li>
                <li>图片可能需要加载时间</li>
                <li>更新应用以获得最佳体验</li>
            </ul>
        </div>
    </div>
</body>
</html>
